<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bilge - Türk Yapay Zekâ Asistanı</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      background-color: #cc0000;
      color: white;
      padding: 20px;
    }

    header img {
      width: 40px;
      vertical-align: middle;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f0f0f0;
    }

    .msg {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background-color: #e1f5fe;
      color: #0077c2;
    }

    .bot {
      align-self: flex-start;
      background-color: #fff;
      color: #333;
      border: 1px solid #ddd;
    }

    #input-container {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
      outline: none;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" alt="TR Bayrağı">
    <span style="font-size: 1.2em;"> Bilge - Türk Yapay Zekâ Asistanı</span>
  </header>

  <div id="messages"></div>

  <div id="input-container">
    <input type="text" id="input" placeholder="Bilge'ye bir şeyler sor..." autocomplete="off" />
  </div>
</div>

<script>
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  input.addEventListener("keydown", async function(event) {
    if (event.key === "Enter") {
      const msg = input.value.trim();
      if (!msg) return;

      appendMessage("user", msg);
      input.value = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        const data = await response.json();
        appendMessage("bot", data.reply);
      } catch (err) {
        appendMessage("bot", "Sunucu hatası oluştu.");
        console.error(err);
      }
    }
  });

  function appendMessage(sender, text) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.innerHTML = `<strong>${sender === "user" ? "Sen" : "Bilge"}:</strong> ${text}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
