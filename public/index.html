<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bilge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #f0f0f0;
      padding: 10px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #chatbox {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      height: 95vh;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px;
      background-color: #ffffff;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    header img.flag {
      width: 24px;
      height: auto;
    }

    header h2 {
      font-size: 1.5rem;
      color: #cc0000;
      flex-grow: 1;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #fafafa;
    }

    .msg {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .user {
      text-align: right;
      color: #007bff;
    }

    .bot {
      text-align: left;
      color: #222;
    }

    .bot img.flag {
      vertical-align: middle;
      width: 16px;
      margin-right: 5px;
    }

    .input-area {
      display: flex;
      align-items: center;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fff;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 1rem;
    }

    .icon {
      font-size: 1.5rem;
      margin-left: 10px;
      cursor: pointer;
      user-select: none;
      color: #cc0000;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
        height: 100vh;
      }

      #chatbox {
        border-radius: 0;
        height: 100vh;
      }

      .icon {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div id="chatbox">
    <header>
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" class="flag" alt="TR Bayrağı">
      <h2>Bilge</h2>
    </header>

    <main id="messages" aria-live="polite"></main>

    <div class="input-area">
      <input type="text" id="input" placeholder="Bilge'ye bir şey sor..." aria-label="Mesaj girin" onkeydown="if(event.key==='Enter'){sendMessage();}">
      <span class="icon" onclick="sendMessage()" aria-label="Mesaj gönder">📨</span>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("input");
      const msg = input.value.trim();
      if (!msg) return;

      const messages = document.getElementById("messages");
      messages.innerHTML += `<div class="msg user"><strong>Sen:</strong> ${msg}</div>`;
      input.value = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        const data = await response.json();
        messages.innerHTML += `
          <div class="msg bot">
            <strong><img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" class="flag" alt="TR"> Bilge:</strong> ${data.reply}
          </div>`;
      } catch (e) {
        messages.innerHTML += `<div class="msg bot"><strong>Bilge:</strong> Hata oluştu: ${e.message}</div>`;
      }

      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
