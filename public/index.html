<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bilge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 0;
      margin: 0;
    }

   #chatbox {
  max-width: 800px;
  margin: auto;
  background: #fff;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
      background-color: #fff;
      
    }

    .flag-small {
      width: 24px;
      height: auto;
    }

    h2 {
      margin: 0;
      color: #cc0000;
      font-size: 1.5rem;
    }

    #messages {
  max-height: calc(100dvh - 130px); 
  overflow-y: auto;
  padding: 10px;
  background: #fafafa;
}

    .msg {
      margin: 10px 0;
      line-height: 1.5;
    }

    .user {
      text-align: right;
      color: #007bff;
    }

    .bot {
      text-align: left;
      color: #222;
    }

    .input-area {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
    }

    .icon {
      font-size: 1.5rem;
      color: #cc0000;
      margin-left: 10px;
      cursor: pointer;
      user-select: none;
    }

    @media (max-width: 768px) {
      #chatbox {
        height: 100dvh;
        max-width: 100%;
        border-radius: 0;
      }

      h2 {
        font-size: 1.2rem;
      }

      .flag-small {
        width: 20px;
      }

      .icon {
        font-size: 2rem;
        margin-left: 8px;
      }

      input[type="text"] {
        font-size: 0.95rem;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>

<div id="chatbox">
  <div id="header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" alt="TR Bayrağı" class="flag-small">
    <h2>Bilge</h2>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Bilge'ye bir şey sor..." onkeydown="if(event.key === 'Enter'){ sendMessage(); }">
    <span class="icon" onclick="sendMessage()">📨</span>
  </div>
</div>

<script>
  async function sendMessage() {
    const input = document.getElementById("input");
    const msg = input.value.trim();
    if (!msg) return;

    const messages = document.getElementById("messages");
    messages.innerHTML += `<div class="msg user"><strong>Sen:</strong> ${msg}</div>`;
    input.value = "";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });

      const data = await response.json();
      messages.innerHTML += `
        <div class="msg bot">
          <strong><img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" class="flag-small" alt="TR Bayrağı"> Bilge:</strong> ${data.reply}
        </div>`;
    } catch (e) {
      messages.innerHTML += `<div class="msg bot"><strong>Bilge:</strong> Hata oluştu: ${e.message}</div>`;
    }

    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
