<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bilge - Türk Yapay Zekâ Asistanı</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #f6f6f6;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chatbox {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background-color: #cc0000;
      color: #fff;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      position: relative;
    }
    header img {
      width: 30px;
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
    }
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .msg {
      margin: 10px 0;
      line-height: 1.5;
    }
    .user {
      text-align: right;
      color: #0066cc;
    }
    .bot {
      text-align: left;
      color: #222;
    }
    footer {
      padding: 10px 16px;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }
    #input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div id="chatbox">
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" alt="TR Bayrağı">
     Bilge - Türk Yapay Zekâ Asistanı
  </header>
  <div id="messages"></div>
  <footer>
    <input type="text" id="input" placeholder="Bilge'ye bir soru yazın ve Enter'a basın..." autocomplete="off" />
  </footer>
</div>

<script>
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      const msg = input.value.trim();
      messages.innerHTML += `<div class="msg user"><strong>Sen:</strong> ${msg}</div>`;
      input.value = "";

      try {
        const response = await fetch("https://bilgechat.onrender.com/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        const data = await response.json();
        messages.innerHTML += `<div class="msg bot"><strong>Bilge:</strong> ${data.reply}</div>`;
      } catch (err) {
        messages.innerHTML += `<div class="msg bot"><strong>Bilge:</strong> Sunucu hatası. Lütfen tekrar deneyin.</div>`;
      }

      messages.scrollTop = messages.scrollHeight;
    }
  });
</script>

</body>
</html>
