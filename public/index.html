<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bilge - Türk Yapay Zekâ Asistanı</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; padding: 20px; }
    #chatbox { max-width: 600px; margin: auto; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #cc0000; }
    .flag { display: block; margin: auto; width: 50px; }
    .msg { margin: 10px 0; }
    .user { text-align: right; color: #007bff; }
    .bot { text-align: left; color: #222; }
    input[type="text"] { width: 85%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 10px; margin-left: 5px; background-color: #cc0000; color: white; border: none; border-radius: 5px; }
  </style>
</head>
<body>

<div id="chatbox">
  <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" alt="TR Bayrağı" class="flag">
  <h2>🤖 Bilge - Türk Yapay Zekâ Asistanı</h2>
  <div id="messages"></div>
  <input type="text" id="input" placeholder="Bilge'ye bir soru sor..." />
  <button onclick="sendMessage()">Gönder</button>
</div>

<script>
  async function sendMessage() {
    const input = document.getElementById("input");
    const msg = input.value.trim();
    if (!msg) return;

    const messages = document.getElementById("messages");
    messages.innerHTML += `<div class="msg user"><strong>Sen:</strong> ${msg}</div>`;
    input.value = "";

    // Burada server adresini Render URL'nizle güncellemeyi unutmayın!
    const response = await fetch("https://bilgechat.onrender.com//api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });

    const data = await response.json();
    messages.innerHTML += `<div class="msg bot"><strong>Bilge:</strong> ${data.reply}</div>`;
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
