<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bilge - Türk Yapay Zekâ Asistanı</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to right, #ece9e6, #ffffff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #chatbox {
      width: 80%;
      max-width: 960px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .flag {
      width: 50px;
      display: block;
      margin: 16px auto 0;
    }
    h2 {
      text-align: center;
      color: #cc0000;
      margin: 10px 0 0 0;
      font-size: 24px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      font-size: 16px;
    }
    .msg {
      margin: 12px 0;
      line-height: 1.6;
    }
    .user {
      text-align: right;
      color: #0056b3;
    }
    .bot {
      text-align: left;
      color: #222;
    }
    .input-area {
      display: flex;
      padding: 16px;
      border-top: 1px solid #ddd;
      background-color: #fafafa;
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      line-height: 1.4;
    }
    button {
      background-color: #cc0000;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      margin-left: 12px;
      font-size: 20px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #a00000;
    }
    @media (max-width: 768px) {
      #chatbox {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

<div id="chatbox">
  <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" alt="TR Bayrağı" class="flag">
  <h2> Bilge - Türk Yapay Zekâ Asistanı</h2>
  <div id="messages"></div>
  <div class="input-area">
    <textarea id="input" rows="1" placeholder="Bir şeyler yaz..." oninput="autoResize(this)"></textarea>
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey && !isMobile()) {
      e.preventDefault();
      sendMessage();
    }
  });

  function isMobile() {
    return /Mobi|Android|iPhone/i.test(navigator.userAgent);
  }

  function autoResize(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + "px";
  }

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    messages.innerHTML += `<div class="msg user"><strong>Sen:</strong> ${msg}</div>`;
    input.value = "";
    autoResize(input);

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });

    const data = await response.json();
    messages.innerHTML += `<div class="msg bot"><strong>Bilge:</strong> ${data.reply}</div>`;
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
